<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Tambola Online - Cloud Multiplayer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="app-shell">
    <header>
      <h1>👑 Royal Tambola Online</h1>
      <div class="badge-row">
        <span class="pill live" id="netBadge">● Online Ready</span>
        <span class="pill">Auto-Session Recovery</span>
        <span class="pill">Anti-Bogey Verification</span>
      </div>
    </header>

    <!-- Lobby Setup -->
    <div class="panel" id="lobbyPanel">
      <div class="row">
        <input type="text" id="playerName" placeholder="Enter your name" maxlength="18" />
        <button onclick="createRoom()">✨ Host Online Room</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <input type="text" id="roomInput" placeholder="Enter Room Code (e.g., TAM-4821)" style="text-transform: uppercase;" />
        <button class="info" onclick="joinRoom()">🚀 Join Online Room</button>
      </div>
      <div id="lobbyMsg" style="margin-top: 10px; font-size: 0.85rem; color: var(--accent);"></div>
    </div>

    <!-- Active Game Room -->
    <div id="roomPanel" style="display: none; gap: 14px;" class="app-shell">
      <div class="panel">
        <div class="room-bar">
          <div class="row">
            <span>Room:</span>
            <span class="room-code" id="roomCodeDisplay">-</span>
            <button class="sec" onclick="copyInviteLink()">🔗 Share Invite Link</button>
          </div>
          <div class="row">
            <span style="font-size: 0.85rem; color: var(--muted);">Called: <strong id="callCount" style="color: var(--text);">0</strong>/90</span>
            <button class="sec" id="reconnectBtn" onclick="manualReconnect()" style="display:none;">🔄 Reconnect</button>
          </div>
        </div>
        <div class="players-list" id="playersList"></div>
      </div>

      <!-- Host Caller Controls -->
      <div class="panel" id="hostPanel" style="display: none;">
        <div class="row" style="justify-content: space-between;">
          <div class="row">
            <button id="drawBtn" onclick="hostDrawNumber()">🎲 Draw Number</button>
            <button class="sec" id="autoBtn" onclick="toggleAutoCaller()">▶ Auto Caller (5s)</button>
          </div>
          <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="voiceCheck" checked style="min-width: auto;" /> 🔊 Voice Caller
          </label>
        </div>
      </div>

      <!-- Recent Numbers -->
      <div class="panel">
        <div style="font-size: 0.82rem; color: var(--muted); margin-bottom: 6px;">Recent Calls (Latest First):</div>
        <div class="recent-calls" id="recentCalls">
          <span style="font-size: 0.85rem; color: var(--muted);">Waiting for host to draw first number...</span>
        </div>
      </div>

      <!-- Ticket & Claims -->
      <div class="panel">
        <div class="row" style="justify-content: space-between;">
          <strong>🎟️ Your Ticket (<span id="ticketOwner">-</span>)</strong>
          <label style="font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="autoDaubCheck" style="min-width: auto;" /> Auto-Mark
          </label>
        </div>
        <div class="ticket" id="ticketGrid"></div>

        <div style="margin-top: 14px; font-weight: 700; font-size: 0.9rem;">🏆 Claim Prizes:</div>
        <div class="claims-grid">
          <button class="claim-btn" id="claim-jaldi5" onclick="submitClaim('jaldi5')">Jaldi Five</button>
          <button class="claim-btn" id="claim-topLine" onclick="submitClaim('topLine')">Top Line</button>
          <button class="claim-btn" id="claim-midLine" onclick="submitClaim('midLine')">Middle Line</button>
          <button class="claim-btn" id="claim-botLine" onclick="submitClaim('botLine')">Bottom Line</button>
          <button class="claim-btn" id="claim-corners" onclick="submitClaim('corners')">Four Corners</button>
          <button class="claim-btn" id="claim-fullHouse" onclick="submitClaim('fullHouse')">Full House</button>
        </div>
      </div>

      <!-- Master 1-90 Board -->
      <div class="panel">
        <strong>📋 Master Board (1–90)</strong>
        <div class="board" id="masterBoard"></div>
      </div>
    </div>
  </div>

  <!-- Draw Popup -->
  <div id="drawPopup" onclick="closePopup()">
    <div class="popup-card" onclick="event.stopPropagation(); closePopup();">
      <div style="font-size: 0.8rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase;">Number Drawn</div>
      <div class="popup-num" id="popupNum">--</div>
      <div class="popup-lingo" id="popupLingo">Good luck!</div>
      <div style="font-size: 0.75rem; color: var(--muted);">Tap to close</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
